name: "Publish"

on:
  push:
    branches:
      - main

jobs:
  build-rust:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & Tauri CLI
        run: |
          npm install
          npm install --save-dev @tauri-apps/cli@latest

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v4.1.0
          releaseName: "Glider Patch 4.1"
          body: "Automated desktop release for Glider (Windows & macOS)"
          draft: false
          prerelease: false
          args: ${{ matrix.args }}